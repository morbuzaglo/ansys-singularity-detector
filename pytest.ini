[pytest]
minversion = 8.0
testpaths = tests
addopts = -ra --strict-markers --import-mode=importlib
# `timeout` is honoured once pytest-timeout is installed (in requirements-dev.txt).
timeout = 120
timeout_method = thread

markers =
    unit: pure-Python, no Ansys, fast (default lane; runs in --quick).
    mechanical: requires a real Ansys install + license; launches Mechanical.
    regression: guards a previously fixed bug or a frozen benchmark metric.
    benchmark: full validation-model solve; slow. Only in --full.
    slow: takes more than a few seconds.
